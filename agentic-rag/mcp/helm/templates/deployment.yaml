apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-search-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-search-rag
  template:
    metadata:
      labels:
        app: vector-search-rag
        hpe-ezua/app: {{ .Chart.Name }}
        hpe-ezua/type: vendor-service
    spec:
      restartPolicy: Always
      containers:
        - name: {{ .Chart.Name }}
          image: ghcr.io/ai-solution-eng/vector-search-mcp:{{ .Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.env.MCP_PORT }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
