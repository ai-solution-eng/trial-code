[project]
name = "rag-ingest"
version = "0.1.0"
description = "Ingestion half of a RAG pipeline: local files -> NVIDIA embeddings -> Qdrant"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.28",
    "langchain-community>=0.4",
    "langchain-core>=1.0",
    "langchain-nvidia-ai-endpoints>=1.0",
    "langchain-qdrant>=1.0",
    "langchain-text-splitters>=0.3",
    "python-dotenv>=1.0",
    "qdrant-client>=1.14.1,<1.15",
    "pypdf>=5",
]
