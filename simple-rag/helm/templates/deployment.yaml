apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-rag
  template:
    metadata:
      labels:
        app: simple-rag
        hpe-ezua/app: {{ .Chart.Name }}
        hpe-ezua/type: vendor-service
    spec:
      restartPolicy: Always
      containers:
        - name: {{ .Chart.Name }}
          image: harbor.tr7-0211-ai-application.pcai0211.tr7.hpecolo.net/trial/simple-rag:{{ .Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
