env:
  LLM_URL: ""
  LLM_KEY: ""
  LLM_MODEL: ""
  EMBED_URL: ""
  EMBED_KEY: ""
  EMBED_MODEL: "nvidia/nv-embedqa-e5-v5"
  QDRANT_URL: "http://qdrant.qdrant.svc.cluster.local"
  QDRANT_COLLECTION: "anywhere"

service:
  httpPort : 8501

resources:
  requests:
    cpu: 1
    memory: 1Gi
  limits:
    cpu: 4
    memory: 8Gi

ezua:
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "simple-rag.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
